  <style>
    :root { --fg:#1f2328; --muted:#59636e; --accent:#0969da; --line:#d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f0f6fc; --muted:#9198a1; --accent:#58a6ff; --line:#30363d; }
    }
    .name { font: 600 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); letter-spacing: -1px; }
    .role { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .rule { stroke: var(--line); stroke-width: 1; }
    .tick { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw 0.9s cubic-bezier(.2,.7,.2,1) 0.9s forwards; }
    .in  { opacity: 0; animation: in 1s ease-out 0.15s forwards; }
    .in2 { opacity: 0; animation: in 1s ease-out 0.45s forwards; }
    .in3 { opacity: 0; animation: in 1s ease-out 0.7s forwards; }
    .waves { opacity: 0; animation: in 1.8s ease-out 0.3s forwards; }
    @keyframes in { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in, .in2, .in3, .waves { animation: none; opacity: 1; }
      .tick { animation: none; stroke-dashoffset: 0; }
    }
  </style>

