<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Shriniketan Rao. Independent researcher in LLM evaluation and reliability.">
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --accent:#0969da; --line:#d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f0f6fc; --muted:#9198a1; --accent:#58a6ff; --line:#30363d; }
    }
    .name { font: 600 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); letter-spacing: -1px; }
    .role { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .dot  { fill: var(--accent); }
    .rule { stroke: var(--line); stroke-width: 1; }
    .in   { opacity: 0; animation: in 1.1s ease-out 0.2s forwards; }
    .in2  { opacity: 0; animation: in 1.1s ease-out 0.55s forwards; }
    @keyframes in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .in, .in2 { animation: none; opacity: 1; }
    }
  </style>

  <text class="name in" x="48" y="104">Shriniketan Rao</text>
  <text class="role in2" x="50" y="142">Independent researcher. LLM evaluation and reliability.</text>

  <line class="rule" x1="48" y1="196" x2="832" y2="196"/>

  <!-- echo: one signal, repeating outward -->
  <g transform="translate(748 106)">
    <circle class="dot" r="4"/>
    <circle class="ring" r="8" opacity="0">
      <animate attributeName="r" from="8" to="84" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle class="ring" r="8" opacity="0">
      <animate attributeName="r" from="8" to="84" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle class="ring" r="8" opacity="0">
      <animate attributeName="r" from="8" to="84" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
